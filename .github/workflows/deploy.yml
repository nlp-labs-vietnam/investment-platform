name: Deploy to Production

# Trigger: push lên main hoặc dispatch thủ công
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options: [production, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # không cancel deploy đang chạy

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build frontend assets trên GitHub Actions (không cần hardware)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Frontend Assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets-${{ github.sha }}
          path: public/build/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Deploy lên VPS qua SSH (cần secrets: xem README Deploy)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy → ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets-${{ github.sha }}
          path: public/build/

      - name: Package release archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='*.tar.gz' \
            --exclude='.env' \
            --exclude='tests' \
            -czf /tmp/deploy_${{ github.sha }}.tar.gz .
          echo "Archive size: $(du -sh /tmp/deploy_${{ github.sha }}.tar.gz | cut -f1)"

      - name: Upload archive to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          source:   /tmp/deploy_${{ github.sha }}.tar.gz
          target:   /tmp/

      - name: Run deploy on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/var/www/investment-platform' }}"
            ARCHIVE="/tmp/deploy_${{ github.sha }}.tar.gz"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            RELEASE_DIR="${DEPLOY_PATH}/releases/${TIMESTAMP}"
            CURRENT_LINK="${DEPLOY_PATH}/current"

            echo "▶ [1/7] Giải nén release mới..."
            mkdir -p "${RELEASE_DIR}"
            tar -xzf "${ARCHIVE}" -C "${RELEASE_DIR}"
            rm -f "${ARCHIVE}"

            echo "▶ [2/7] Symlink .env từ shared..."
            ln -sf "${DEPLOY_PATH}/shared/.env" "${RELEASE_DIR}/.env"

            echo "▶ [3/7] Symlink storage từ shared..."
            rm -rf "${RELEASE_DIR}/storage"
            ln -sf "${DEPLOY_PATH}/shared/storage" "${RELEASE_DIR}/storage"

            echo "▶ [4/7] Cài PHP dependencies..."
            cd "${RELEASE_DIR}"
            composer install --no-dev --optimize-autoloader --no-interaction --quiet

            echo "▶ [5/7] Chạy migrations..."
            php artisan migrate --force --no-interaction

            echo "▶ [6/7] Tối ưu Laravel..."
            php artisan config:cache  --no-interaction
            php artisan route:cache   --no-interaction
            php artisan view:cache    --no-interaction
            php artisan event:cache   --no-interaction
            php artisan storage:link  --no-interaction 2>/dev/null || true

            echo "▶ [7/7] Phân quyền & atomic swap..."
            chown -R www-data:developers "${RELEASE_DIR}"
            find "${RELEASE_DIR}" -type d -exec chmod 755 {} +
            find "${RELEASE_DIR}" -type f -exec chmod 644 {} +
            chmod 750 "${RELEASE_DIR}/artisan"
            chmod 640 "${RELEASE_DIR}/.env"

            # Atomic swap: current → new release
            ln -sfn "${RELEASE_DIR}" "${CURRENT_LINK}"

            # Reload PHP-FPM & Nginx gracefully
            sudo systemctl reload php8.2-fpm 2>/dev/null || true
            sudo nginx -t && sudo systemctl reload nginx 2>/dev/null || true

            # Giữ lại 3 release gần nhất
            ls -dt "${DEPLOY_PATH}/releases"/*/ 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true

            echo "✔ Deploy hoàn tất: $(date '+%Y-%m-%d %H:%M:%S') | SHA: ${{ github.sha }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Smoke test sau deploy
  # ─────────────────────────────────────────────────────────────────────────────
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Wait for server to be ready
        run: sleep 10

      - name: Check homepage responds 200
        run: |
          URL="https://${{ secrets.DEPLOY_HOST }}"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "${URL}" || echo "000")
          echo "HTTP status: ${STATUS}"
          if [[ "${STATUS}" != "200" ]]; then
            echo "❌ Smoke test FAILED: ${URL} returned ${STATUS}"
            exit 1
          fi
          echo "✔ Smoke test passed"
