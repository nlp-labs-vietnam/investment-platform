name: GitHub Pages — Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'public/**'
      - 'scripts/install.sh'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'ARCHITECTURE.md'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Permissions for GITHUB_TOKEN to allow Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; skip queued runs but keep in-progress ones
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build GitHub Pages site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build docs site
        run: |
          set -euo pipefail
          mkdir -p _site

          # Disable Jekyll so GitHub Pages serves _site/ directly
          touch _site/.nojekyll

          # CNAME for custom domain
          if [ -f public/CNAME ]; then
            cp public/CNAME _site/CNAME
          fi

          # Copy static docs
          for f in README.md CHANGELOG.md ROADMAP.md ARCHITECTURE.md CONTRIBUTING.md MAINTAINERS.md; do
            [ -f "$f" ] && cp "$f" "_site/$f" || true
          done

          # Copy docs/ directory if it exists
          if [ -d docs ]; then
            cp -r docs/. _site/
          fi

          # Copy public static assets
          for f in robots.txt sitemap.xml; do
            [ -f "public/$f" ] && cp "public/$f" "_site/$f" || true
          done

          # Generate index.html
          cat > _site/index.html << 'HTMLEOF'
