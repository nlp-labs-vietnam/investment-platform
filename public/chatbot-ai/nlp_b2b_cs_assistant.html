<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLP Group — CS Hub B2B</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 14px; background: #f7f8fa; color: #1f2328; }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar { width: 300px; min-width: 260px; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #e5e7eb; overflow: hidden; }
  #sidebar-header { padding: 16px; background: linear-gradient(135deg,#1a3c2e 0%,#2d6a4f 100%); flex-shrink: 0; }
  #sidebar-header h1 { color: #fff; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  #sidebar-header p  { color: rgba(255,255,255,0.65); font-size: 11px; margin-top: 3px; }
  #sidebar-groups { flex: 1; overflow-y: auto; padding: 12px; }
  #sidebar-groups::-webkit-scrollbar { width: 4px; }
  #sidebar-groups::-webkit-scrollbar-thumb { background: #d1fae5; border-radius: 99px; }
  .group-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #2d6a4f; margin: 16px 0 6px; display: flex; align-items: center; gap: 4px; }
  .group-label:first-child { margin-top: 4px; }
  .sop-btn { display: block; width: 100%; text-align: left; padding: 8px 12px; margin-bottom: 4px; border-radius: 8px; border: 1px solid #e5e7eb; background: #fff; color: #374151; font-size: 13px; cursor: pointer; transition: background .15s, border-color .15s; }
  .sop-btn:hover  { background: #f9fafb; border-color: #d1fae5; }
  .sop-btn.active { background: #f0fdf4; border-color: #6ee7b7; color: #1a3c2e; font-weight: 600; }
  #sidebar-footer { padding: 10px; text-align: center; border-top: 1px solid #f3f4f6; font-size: 11px; color: #9ca3af; flex-shrink: 0; }

  /* ── Main panel ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #main-content { flex: 1; padding: 24px; overflow-y: auto; }
  #main-content::-webkit-scrollbar { width: 4px; }
  #main-content::-webkit-scrollbar-thumb { background: #d1fae5; border-radius: 99px; }

  /* Empty state */
  #empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9ca3af; }
  #empty-state svg { width: 56px; height: 56px; margin-bottom: 16px; color: #d1fae5; }
  #empty-state p { font-size: 15px; font-weight: 500; color: #6b7280; }
  #empty-state small { font-size: 12px; margin-top: 4px; }

  /* Selected state */
  #selected-panel { max-width: 680px; margin: 0 auto; display: none; }
  #selected-panel.visible { display: block; }
  .panel-title { font-size: 18px; font-weight: 700; color: #1a3c2e; border-bottom: 2px solid #d1fae5; padding-bottom: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

  /* Form */
  #form-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .form-section-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; margin-bottom: 14px; display: flex; align-items: center; gap: 5px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid.single { grid-template-columns: 1fr; }
  .form-field label { display: block; font-size: 11.5px; font-weight: 500; color: #374151; margin-bottom: 4px; }
  .form-field input { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; background: #fafafa; outline: none; transition: border-color .15s, box-shadow .15s; color: #1f2328; }
  .form-field input:focus { border-color: #6ee7b7; box-shadow: 0 0 0 3px rgba(110,231,183,.2); background: #fff; }

  /* Output */
  #output-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; }
  #output-text { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; white-space: pre-wrap; font-family: inherit; font-size: 13.5px; line-height: 1.7; color: #1f2328; min-height: 80px; }
  #copy-btn { margin-top: 14px; float: right; display: flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 8px; border: none; background: #2d6a4f; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
  #copy-btn:hover { background: #1a3c2e; }
  .clearfix::after { content: ''; display: table; clear: both; }

  /* ── Checklist footer ── */
  #checklist-bar { flex-shrink: 0; background: #fff; border-top: 1px solid #e5e7eb; padding: 12px 20px; }
  .checklist-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: flex-start; gap: 12px; }
  .checklist-icon { padding: 8px; border-radius: 8px; background: #fef3c7; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .checklist-title { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #374151; margin-bottom: 8px; }
  .checklist-items { display: flex; flex-wrap: wrap; gap: 6px 20px; }
  .checklist-items label { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #6b7280; cursor: pointer; }
  .checklist-items input[type=checkbox] { accent-color: #2d6a4f; width: 13px; height: 13px; }

  /* Toast */
  #toast { position: fixed; top: 16px; right: 16px; background: #2d6a4f; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15); opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; }
  #toast.show { opacity: 1; }

  /* Responsive */
  @media (max-width: 640px) {
    #sidebar { width: 100%; position: fixed; top: 0; left: -100%; transition: left .3s; z-index: 100; }
    #sidebar.open { left: 0; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ── SIDEBAR ── -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#6ee7b7"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>

  <!-- ── MAIN ── -->
  <div id="main">
    <div id="main-content">

      <!-- Empty state -->
      <div id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 0 1-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8Z"/></svg>
        <p>Chọn kịch bản hỗ trợ bên trái</p>
        <small id="total-count"></small>
      </div>

      <!-- Selected panel -->
      <div id="selected-panel">
        <div class="panel-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2d6a4f" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5Z"/></svg>
          <span id="panel-title-text"></span>
        </div>

        <!-- Form -->
        <div id="form-card" style="display:none">
          <div class="form-section-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 0 0 2 12h2a8 8 0 1 1 3.93 6.93Z"/></svg>
            Điền biến số
          </div>
          <div id="form-grid" class="form-grid"></div>
        </div>

        <!-- Output -->
        <div id="output-card">
          <div class="form-section-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Nội dung gửi khách
          </div>
          <div id="output-text"></div>
          <div class="clearfix">
            <button id="copy-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Copy tin nhắn
            </button>
          </div>
        </div>
      </div>

    </div><!-- /main-content -->

    <!-- ── CHECKLIST BAR ── -->
    <div id="checklist-bar">
      <div class="checklist-inner">
        <div class="checklist-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <div>
          <div class="checklist-title">CS Checklist trước khi gửi</div>
          <div class="checklist-items" id="checklist-items"></div>
        </div>
      </div>
    </div>
  </div><!-- /main -->

</div><!-- /app -->

<!-- Toast -->
<div id="toast">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  Đã sao chép vào clipboard!
</div>

<script>
// ============================================================
// SOP DATA — NLP Group B2B
// ============================================================
const sopData = [
  {
    group: "Nhóm 0: Tiếp nhận & Phân loại",
    emoji: "📞",
    items: [
      { id:'g0_1', title:"Chào hỏi ban đầu (Inbound)", text:"Xin chào! Tôi là {{cs_name}} từ NLP Group.\nCảm ơn anh/chị đã liên hệ với chúng tôi. Anh/chị có thể cho tôi biết nhu cầu hiện tại để tôi hỗ trợ tốt nhất?\n\n📌 NLP Group cung cấp:\n• Hệ thống điện mặt trời áp mái (50 kW – 5 MW)\n• Trạm sạc EV (AC 7–22 kW / DC 30–480 kW)\n• Giải pháp AI & Chuyển đổi số\n• Tư vấn ESG & Tín chỉ carbon\n\nAnh/chị muốn tìm hiểu về lĩnh vực nào?", inputs:[{key:'cs_name',label:'Tên CS / BD phụ trách'}] },
      { id:'g0_2', title:"Phân loại & Chuyển hướng", text:"Cảm ơn anh/chị {{client_name}} đã chia sẻ!\n\nDựa trên nhu cầu, tôi sẽ kết nối anh/chị với chuyên gia phụ trách:\n• 🔋 Điện mặt trời / BESS → Team NLP Energy\n• ⚡ Trạm sạc EV / Nhượng quyền → Team NLP EV Charging\n• 🤖 Phần mềm / AI → Team NLP Technology\n• 🌿 ESG / Carbon → Team NLP ESG\n\nAnh/chị vui lòng chờ {{wait_time}} phút, chuyên gia sẽ liên hệ ngay.", inputs:[{key:'client_name',label:'Tên khách hàng / Công ty'},{key:'wait_time',label:'Thời gian chờ (phút)'}] },
      { id:'g0_3', title:"Thu thập thông tin cơ bản", text:"Để tư vấn chính xác nhất, anh/chị vui lòng cung cấp:\n\n1. Tên công ty / tổ chức\n2. Ngành nghề kinh doanh chính\n3. Quy mô: số nhân viên / diện tích mặt bằng\n4. Địa chỉ triển khai dự án (tỉnh/thành phố)\n5. Ngân sách dự kiến (nếu có)\n6. Thời gian mong muốn triển khai\n\nThông tin này sẽ giúp đội ngũ NLP chuẩn bị đề xuất phù hợp nhất." },
      { id:'g0_4', title:"Xác nhận lịch tư vấn", text:"Tôi đã ghi nhận thông tin của anh/chị {{client_name}} — {{company}}.\n\n📅 Lịch tư vấn đã đặt:\n• Thời gian: {{meeting_time}}\n• Hình thức: {{meeting_type}}\n• Chuyên gia phụ trách: {{expert_name}}\n\nAnh/chị sẽ nhận email xác nhận trong vòng 30 phút.\nNếu cần điều chỉnh, vui lòng phản hồi lại tin nhắn này.\n\nTrân trọng,\nNLP Group", inputs:[{key:'client_name',label:'Tên khách hàng'},{key:'company',label:'Tên công ty'},{key:'meeting_time',label:'Thời gian họp'},{key:'meeting_type',label:'Hình thức (Zoom / Tại văn phòng / Thực địa)'},{key:'expert_name',label:'Tên chuyên gia'}] },

  {
    group: "Nhóm 1: Điện Mặt Trời (NLP Energy)",
    emoji: "☀️",
    items: [
      { id:'g1_1', title:"Giới thiệu giải pháp Solar", text:"NLP Energy cung cấp giải pháp điện mặt trời toàn diện:\n\n☀️ ĐIỆN MẶT TRỜI ÁP MÁI\n• Quy mô: 50 kW – 5 MW\n• Mô hình: Tự đầu tư hoặc PPA (0 đồng đầu tư)\n• Tiêu chuẩn: Tấm pin PERC / TOPCon, Inverter SMA / Huawei / Sungrow\n• Bảo hành: Tấm pin 25 năm, Inverter 10 năm\n\n🔋 HỆ THỐNG BESS (Lưu trữ điện)\n• Cắt giảm tiền điện giờ cao điểm tới 40%\n• Tích hợp Solar hoặc lưới điện EVN\n\nAnh/chị muốn tìm hiểu mô hình nào phù hợp nhất?" },
      { id:'g1_2', title:"Thông tin cần cho khảo sát mái", text:"Để lập báo giá chính xác, đội kỹ thuật NLP Energy cần:\n\n📋 THÔNG TIN CẦN CHUẨN BỊ:\n1. Hóa đơn điện 3 tháng gần nhất\n2. Diện tích mái trống (m²) + loại mái (tôn / bê tông / ngói)\n3. Ảnh mái chụp từ nhiều góc\n4. Hóa đơn điện gần nhất (xác định 1 pha / 3 pha)\n\nĐội kỹ thuật sẽ đến khảo sát miễn phí tại: {{address}}.\nLịch khảo sát dự kiến: {{survey_date}}.", inputs:[{key:'address',label:'Địa chỉ khảo sát'},{key:'survey_date',label:'Ngày khảo sát dự kiến'}] },
      { id:'g1_3', title:"Báo giá sơ bộ Solar", text:"Dựa trên thông tin khảo sát, NLP Energy đề xuất sơ bộ:\n\n📊 THÔNG SỐ HỆ THỐNG:\n• Công suất lắp đặt: {{capacity}} kWp\n• Sản lượng điện ước tính: {{output}} kWh/năm\n• Tiết kiệm điện/năm: {{saving}} VNĐ\n• Mức giảm CO₂: {{co2}} tấn/năm\n\n💰 CHI PHÍ ĐẦU TƯ:\n• Tổng đầu tư ước tính: {{investment}} VNĐ\n• Thời gian hoàn vốn: {{payback}} năm\n• IRR: {{irr}}%\n\n📄 Báo giá chi tiết sẽ gửi qua email {{email}} trong 24 giờ.", inputs:[{key:'capacity',label:'Công suất (kWp)'},{key:'output',label:'Sản lượng kWh/năm'},{key:'saving',label:'Tiết kiệm VNĐ/năm'},{key:'co2',label:'CO₂ giảm (tấn/năm)'},{key:'investment',label:'Tổng đầu tư (VNĐ)'},{key:'payback',label:'Hoàn vốn (năm)'},{key:'irr',label:'IRR (%)'},{key:'email',label:'Email khách hàng'}] },

      { id:'g2_2', title:"Khảo sát địa điểm EV", text:"Để tư vấn giải pháp phù hợp, NLP EV Charging cần biết:\n\n📋 THÔNG TIN ĐỊA ĐIỂM:\n1. Loại địa điểm: {{location_type}}\n2. Địa chỉ: {{address}}\n3. Diện tích bãi đậu xe (m²)\n4. Số lượng xe EV dự kiến sạc mỗi ngày\n5. Công suất tủ điện hiện có (kW)\n6. Mục tiêu: thu phí / miễn phí nhân viên / nhượng quyền\n\nĐội kỹ thuật NLP khảo sát điện miễn phí và tư vấn phương án tối ưu.", inputs:[{key:'location_type',label:'Loại địa điểm (TTTM/Khách sạn/KCN/Cao tốc)'},{key:'address',label:'Địa chỉ'}] },
      { id:'g2_3', title:"Mô hình nhượng quyền EV", text:"MÔ HÌNH NHƯỢNG QUYỀN TRẠM SẠC NLP — ĐẦU TƯ 0 ĐỒNG:\n\n✅ NLP đầu tư 100%: thiết bị + lắp đặt + CSMS + app\n✅ Đối tác cung cấp: mặt bằng + điện\n✅ Doanh thu chia theo tỷ lệ thỏa thuận\n\nNLP hỗ trợ: Vận hành từ xa, bảo trì NOC 24/7, marketing, báo cáo doanh thu tự động.\n\n💰 ROI bắt đầu từ tháng 18\n\nAnh/chị có mặt bằng tại {{location}} không? Tôi có thể gửi hồ sơ nhượng quyền chi tiết.", inputs:[{key:'location',label:'Tỉnh / Thành phố / Địa điểm cụ thể'}] },

  {
    group: "Nhóm 3: Báo giá & Hợp đồng",

const checklist = [
  "Đã xưng hô đúng anh/chị + tên khách chưa?",
  "Báo giá: số HĐ, ngày, tên dự án đã điền đủ chưa?",
  "Ticket kỹ thuật: đã tạo mã ticket chưa?",
  "Cấp tài khoản: đã dặn đổi mật khẩu ngay chưa?",
  "Escalate: đã thông báo nội bộ người tiếp nhận chưa?",
  "Cuối tin: ký tên + NLP Group đã có chưa?",
];

// ── State ────────────────────────────────────────────────────
let selectedItem = null;
let formValues = {};

// ── Build sidebar ────────────────────────────────────────────
function buildSidebar() {
  const container = document.getElementById('sidebar-groups');
  let totalCount = 0;
  sopData.forEach(group => {
    totalCount += group.items.length;
    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = group.emoji + ' ' + group.group;
    container.appendChild(label);
    group.items.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'sop-btn';
      btn.textContent = item.title;
      btn.dataset.id = item.id;
      btn.addEventListener('click', () => selectItem(item, btn));
      container.appendChild(btn);
    });
  });
  document.getElementById('total-count').textContent = `${totalCount} kịch bản · ${sopData.length} nhóm`;
}

// ── Build checklist ──────────────────────────────────────────
function buildChecklist() {
  const container = document.getElementById('checklist-items');
  checklist.forEach((text, i) => {
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox"> ${text}`;
    container.appendChild(label);
  });
}

// ── Select item ──────────────────────────────────────────────
function selectItem(item, btn) {
  // Deselect all
  document.querySelectorAll('.sop-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedItem = item;
  formValues = {};

  // Show panel
  document.getElementById('empty-state').style.display = 'none';
  const panel = document.getElementById('selected-panel');
  panel.classList.add('visible');
  document.getElementById('panel-title-text').textContent = item.title;

  // Build form
  const formCard = document.getElementById('form-card');
  const formGrid = document.getElementById('form-grid');
  formGrid.innerHTML = '';
  if (item.inputs && item.inputs.length > 0) {
    formCard.style.display = 'block';
    formGrid.className = 'form-grid' + (item.inputs.length <= 2 ? ' single' : '');
    item.inputs.forEach(inp => {
      formValues[inp.key] = '';
      const div = document.createElement('div');
      div.className = 'form-field';
      div.innerHTML = `<label>${inp.label}</label><input type="text" placeholder="Nhập ${inp.label.toLowerCase()}…" data-key="${inp.key}">`;
      div.querySelector('input').addEventListener('input', e => {
        formValues[inp.key] = e.target.value;
        updateOutput();
      });
      formGrid.appendChild(div);
    });
  } else {
    formCard.style.display = 'none';
  }
  updateOutput();
}

// ── Generate & render output ─────────────────────────────────
function generateText() {
  if (!selectedItem) return '';
  let text = selectedItem.text;
  if (selectedItem.inputs) {
    selectedItem.inputs.forEach(inp => {
      const val = formValues[inp.key] || `[${inp.label.toUpperCase()}]`;
      text = text.replace(new RegExp(`{{${inp.key}}}`, 'g'), val);
    });
  }
  return text;
}

function updateOutput() {
  document.getElementById('output-text').textContent = generateText();
}

// ── Copy ──────────────────────────────────────────────────────
document.getElementById('copy-btn').addEventListener('click', () => {
  const text = generateText();
  const el = document.createElement('textarea');
  el.value = text;
  el.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
  document.body.appendChild(el);
  el.focus(); el.select();
  try {
    document.execCommand('copy');
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  } catch(e) { console.error(e); }
  finally { el.remove(); }
});

// ── Init ──────────────────────────────────────────────────────
buildSidebar();
buildChecklist();
</script>
